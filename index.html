<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hermes Citadel</title>
    <meta name="description" content="Ambient observability for the Hermes agent system." />

    <!-- PWA Meta -->
    <meta name="theme-color" content="#0c1715" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hermes Citadel" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="/citadel-mark.svg" />
    <link rel="icon" type="image/svg+xml" href="/citadel-mark.svg" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body style="background-color: #091311; margin: 0; color: #f6ecd6; font-family: system-ui, sans-serif;">
    <div id="root">
      <div style="display:flex; height:100vh; align-items:center; justify-content:center; flex-direction:column; gap:16px; background:radial-gradient(circle at 50% 35%,#183934,#091311 68%);">
        <img src="/citadel-mark.svg" width="58" height="58" alt="" style="filter:drop-shadow(0 0 16px #48cfe055)" />
        <div style="font-weight:700; font-size: 11px; letter-spacing: .16em; animation: pulse 1.5s infinite;">BUDZENIE CYTADELI…</div>
        <style>
          @keyframes spin { 100% { transform: rotate(360deg); } }
          @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
          @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
